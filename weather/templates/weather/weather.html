{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="{% static 'weather/style.css' %}">
</head>
<body>
    <header>
        <h2>Whats the weather like?</h2>
    </header>

    <main>
        <section class ="container">
            <div class = "search-box">
                <input 
                type="text"
                id="cityInput"
                placeholder="City Name"
                >

                <button onclick="addCity()">Add City</button>
            </div>

            <div id="weatherContainer">
                <div class="weather-card">

                    <!-- temperature icon -->
                    <img class="weather-icon"
                    src="https://openweathermap.org/img/w/{{ city_weather.icon }}.png"
                    alt="Weather Icon">

                    <div class = "weather-info">
                        <!-- city name -->
                        <h3>{{ city_weather.city }}</h3>
                        <!-- temperature -->
                        <p>{{ city_weather.temperature }}</p>
                        <!-- description -->
                        <p>{{ city_weather.description }}</p>
                    </div>
                </div>
            </div>
        </section>
        <section class="grey-section"></section>
    </main>
</body>
</html>
