{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Web</title>
    <link rel="stylesheet" href="{% static 'weather/style.css' %}">
</head>
<body>
    <header>
        <center><h2>Whats the weather</h2></center>
    </header>

    <main>
        <section class ="container">
            <form method = "POST">
                {% csrf_token %}
                <div class = "search-box">

                    {{ form.name }}
                    <button type = "submit" >Add City</button>
                </div>
            </form>

            {% for city_weather in weather_data %}
            <div id="weatherContainer">
                <div class="weather-card">

                    <!-- temperature icon -->
                    <img class="weather-icon"
                    src="https://openweathermap.org/img/w/{{ city_weather.icon }}.png"
                    alt="Weather Icon">
                    
                    <div class = "weather-info">
                        <!-- city name -->
                        <h3>{{ city_weather.city }}</h3>
                        <!-- temperature -->
                        <p>{{ city_weather.temperature }}° C</p>
                        <!-- description -->
                        <p>{{ city_weather.description }}</p>
                    </div>
                </div>
            </div>
            {% endfor %}

        </section>
        <section class="grey-section"></section>
    </main>
</body>
</html>
